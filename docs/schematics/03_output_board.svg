<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}</style><text x="40" y="50" class="t">FOXBODY BCM - OUTPUT BOARD / LOGIC CONTROL</text><text x="40" y="82" class="s">Output Board = Eletechsup OPMSD16 PNP 12V. Direct-load rule: keep normal continuous load at or below 4A; higher/inrush loads use relay or dedicated driver.</text><text x="55" y="145" class="h">F03 OUTPUT CONTROL - 5A</text><line x1="120" y1="165" x2="120" y2="225" class="p"/><rect x="65" y="225" width="220" height="55" class="box"/><text x="95" y="260" class="s">FUSED BCM +12V</text><rect x="360" y="120" width="800" height="820" class="box"/><text x="655" y="155" class="h">OUTPUT BOARD</text><text x="610" y="185" class="s">Eletechsup OPMSD16 PNP 12V</text><text x="400" y="235" class="h">CONTROL INPUTS</text><text x="400" y="270" class="s">X1-X16 require 8-25V on this 12V version</text><text x="400" y="300" class="s">COM = control common; exact polarity follows board's negative-control wiring</text><text x="400" y="340" class="h">LOAD OUTPUTS</text><text x="400" y="375" class="s">Y1-Y16 = MOSFET switched load outputs</text><text x="400" y="405" class="s">Published ceiling at 8-24V load = under 5A/channel</text><text x="400" y="435" class="s">Project design ceiling = 4A continuous/channel</text><text x="665" y="235" class="h">PROVISIONAL Y ASSIGNMENTS</text><g class="s"><text x="665" y="275">Y01 Parking / marker lamps</text><text x="665" y="305">Y02 Puddle lights</text><text x="665" y="335">Y03 Courtesy/interior lights</text><text x="665" y="365">Y04 Left turn output</text><text x="665" y="395">Y05 Right turn output</text><text x="665" y="425">Y06 Horn relay coil</text><text x="665" y="455">Y07 Rear-defrost relay coil</text><text x="665" y="485">Y08 Hatch release</text><text x="665" y="515">Y09 Fuel-door release</text><text x="665" y="545">Y10 Headlamp relay coil</text><text x="665" y="575">Y11 High-beam relay coil</text><text x="665" y="605">Y12 Wiper LOW relay/control</text><text x="665" y="635">Y13 Wiper HIGH relay/control</text><text x="665" y="665">Y14 Washer pump output/relay</text><text x="665" y="695">Y15 Starter relay coil</text><text x="665" y="725">Y16 Spare / future</text></g><rect x="1195" y="150" width="430" height="350" class="box"/><text x="1270" y="190" class="h">LOGIC-TO-12V INTERFACE</text><text x="1230" y="235" class="s">Pi / I/O Expander logic is 3.3/5V.</text><text x="1230" y="265" class="s">This 12V Output Board must NOT be driven directly.</text><text x="1230" y="300" class="s">Use a 16-channel 3.3V-compatible sinking interface</text><text x="1230" y="330" class="s">between logic and X1-X16. Interface current is only</text><text x="1230" y="360" class="s">the Output Board optocoupler input current.</text><line x1="1200" y1="410" x2="1280" y2="410" class="sig"/><rect x="1280" y="380" width="190" height="60" class="box"/><text x="1305" y="417" class="s">LOGIC INTERFACE</text><line x1="1470" y1="410" x2="1600" y2="410" class="ctl"/><text x="1195" y="455" class="s">Exact interface module/terminal part is still the one control-side item to freeze.</text><rect x="1195" y="550" width="430" height="285" class="box"/><text x="1250" y="590" class="h">WHEN TO USE A RELAY</text><text x="1230" y="635" class="s">Direct MOSFET: <=4A continuous, mild inrush.</text><text x="1230" y="670" class="s">Relay/dedicated driver: >4A, strong inrush, motor,</text><text x="1230" y="700" class="s">starter, cooling fan, defrost, or safety isolation.</text><text x="1230" y="750" class="s">Windows and locks are NOT relayed:</text><text x="1230" y="780" class="s">they use Window Driver MDD20A and Lock Driver MDD10A.</text><line x1="120" y1="280" x2="120" y2="980" class="g"/><text x="50" y="1015" class="s">BCM GROUND BUS</text><text x="40" y="1060" class="s">The logic-interface requirement is electrically necessary because the owned Output Board is the 12V-input version. Do not connect Pi GPIO directly to X1-X16.</text></svg>