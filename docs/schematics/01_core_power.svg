<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<style>
text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.bus{stroke:#666;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}
</style>
<text x="40" y="50" class="t">FOXBODY BCM - CORE POWER / GROUND DISTRIBUTION</text>
<text x="40" y="82" class="s">Working architecture sheet. Final fuse values, wire colors and connector IDs require verification.</text>

<text x="65" y="150" class="h">BATTERY +</text><line x1="110" y1="170" x2="110" y2="220" class="p"/>
<rect x="65" y="220" width="170" height="55" class="box"/><text x="100" y="255" class="s">MAIN BCM FUSE</text>
<line x1="235" y1="247" x2="1450" y2="247" class="p"/><text x="670" y="225" class="h">FUSED +12V DISTRIBUTION BUS</text>

<g>
<line x1="330" y1="247" x2="330" y2="340" class="p"/><rect x="250" y="340" width="160" height="50" class="box"/><text x="280" y="372" class="s">PI / LOGIC FUSE</text>
<line x1="330" y1="390" x2="330" y2="470" class="p"/><rect x="240" y="470" width="180" height="110" class="box"/><text x="270" y="505" class="h">12V -> 5V DC/DC</text><text x="270" y="545" class="s">Pi supply</text>
</g>

<g>
<line x1="570" y1="247" x2="570" y2="340" class="p"/><rect x="490" y="340" width="160" height="50" class="box"/><text x="515" y="372" class="s">INPUT BRD FUSE</text>
<line x1="570" y1="390" x2="570" y2="470" class="p"/><rect x="470" y="470" width="220" height="150" class="box"/><text x="510" y="505" class="h">24DIB32 NPN</text><text x="500" y="545" class="s">VIN +12V</text><text x="500" y="580" class="s">GND / COM as verified</text>
</g>

<g>
<line x1="810" y1="247" x2="810" y2="340" class="p"/><rect x="730" y="340" width="160" height="50" class="box"/><text x="750" y="372" class="s">OUTPUT BRD FUSE</text>
<line x1="810" y1="390" x2="810" y2="470" class="p"/><rect x="710" y="470" width="220" height="150" class="box"/><text x="750" y="505" class="h">OPMSD16 PNP</text><text x="745" y="545" class="s">Power/control terminals</text><text x="745" y="580" class="s">Y1-Y16 outputs</text>
</g>

<g>
<line x1="1050" y1="247" x2="1050" y2="340" class="p"/><rect x="965" y="340" width="170" height="50" class="box"/><text x="988" y="372" class="s">WINDOW FUSE</text>
<line x1="1050" y1="390" x2="1050" y2="470" class="p"/><rect x="950" y="470" width="220" height="150" class="box"/><text x="1000" y="505" class="h">MDD20A</text><text x="980" y="545" class="s">Two window motors</text><text x="980" y="580" class="s">High-current branch</text>
</g>

<g>
<line x1="1290" y1="247" x2="1290" y2="340" class="p"/><rect x="1205" y="340" width="170" height="50" class="box"/><text x="1235" y="372" class="s">LOCK FUSE</text>
<line x1="1290" y1="390" x2="1290" y2="470" class="p"/><rect x="1190" y="470" width="220" height="150" class="box"/><text x="1240" y="505" class="h">MDD10A</text><text x="1220" y="545" class="s">Two lock actuators</text><text x="1220" y="580" class="s">High-current branch</text>
</g>

<text x="65" y="710" class="h">BATTERY -</text><line x1="110" y1="730" x2="110" y2="800" class="g"/>
<line x1="110" y1="800" x2="1450" y2="800" class="g"/><text x="650" y="835" class="h">CHASSIS / BCM GROUND BUS</text>
<line x1="330" y1="580" x2="330" y2="800" class="g"/><line x1="570" y1="620" x2="570" y2="800" class="g"/><line x1="810" y1="620" x2="810" y2="800" class="g"/><line x1="1050" y1="620" x2="1050" y2="800" class="g"/><line x1="1290" y1="620" x2="1290" y2="800" class="g"/>
<text x="65" y="880" class="s">Engine block/body/battery bonding must be heavy and reliable. High-current motor return paths must not flow through Raspberry Pi signal grounds.</text>
</svg>