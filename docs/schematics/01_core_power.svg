<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<style>
text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.xs{font-size:13px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.bus{stroke:#666;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}
</style>
<text x="40" y="50" class="t">FOXBODY BCM - CORE POWER / GROUND DISTRIBUTION</text>
<text x="40" y="82" class="s">Board aliases are used first; actual model numbers are shown in parentheses. Fuse values are the v1 design baseline.</text>

<text x="65" y="150" class="h">BATTERY +</text><line x1="110" y1="170" x2="110" y2="220" class="p"/>
<rect x="65" y="220" width="190" height="55" class="box"/><text x="90" y="255" class="h">F00 MAIN - 80A</text>
<line x1="255" y1="247" x2="1450" y2="247" class="p"/><text x="650" y="225" class="h">FUSED BCM ELECTRONICS / BODY POWER BUS +12V</text>
<text x="1010" y="285" class="xs">Fans, starter and other very high-current loads get separate feeds and are NOT carried through F00.</text>

<g>
<line x1="330" y1="247" x2="330" y2="340" class="p"/><rect x="240" y="340" width="180" height="50" class="box"/><text x="263" y="372" class="s">F01 CONTROLLER - 5A</text>
<line x1="330" y1="390" x2="330" y2="470" class="p"/><rect x="220" y="470" width="220" height="130" class="box"/><text x="260" y="505" class="h">BCM CONTROLLER</text><text x="255" y="535" class="s">Raspberry Pi 4B</text><text x="245" y="565" class="s">12V -&gt; 5V DC/DC supply</text>
</g>

<g>
<line x1="570" y1="247" x2="570" y2="340" class="p"/><rect x="480" y="340" width="180" height="50" class="box"/><text x="503" y="372" class="s">F02 INPUT BOARD - 3A</text>
<line x1="570" y1="390" x2="570" y2="470" class="p"/><rect x="460" y="470" width="220" height="150" class="box"/><text x="510" y="505" class="h">INPUT BOARD</text><text x="500" y="535" class="s">24DIB32 NPN</text><text x="495" y="565" class="s">32 digital inputs / RS485</text><text x="495" y="595" class="s">VIN +12V / GND</text>
</g>

<g>
<line x1="810" y1="247" x2="810" y2="340" class="p"/><rect x="720" y="340" width="180" height="50" class="box"/><text x="739" y="372" class="s">F03 OUTPUT CTRL - 5A</text>
<line x1="810" y1="390" x2="810" y2="470" class="p"/><rect x="700" y="470" width="230" height="150" class="box"/><text x="752" y="505" class="h">OUTPUT BOARD</text><text x="750" y="535" class="s">OPMSD16 PNP</text><text x="732" y="565" class="s">16 MOSFET outputs / control</text><text x="725" y="595" class="xs">High-current load feeds fused separately</text>
</g>

<g>
<line x1="1050" y1="247" x2="1050" y2="340" class="p"/><rect x="955" y="340" width="190" height="50" class="box"/><text x="974" y="372" class="s">F04 WINDOWS - 40A</text>
<line x1="1050" y1="390" x2="1050" y2="470" class="p"/><rect x="940" y="470" width="230" height="150" class="box"/><text x="985" y="505" class="h">WINDOW DRIVER</text><text x="995" y="535" class="s">Cytron MDD20A</text><text x="975" y="565" class="s">Dual H-bridge / 2 windows</text><text x="975" y="595" class="s">High-current branch</text>
</g>

<g>
<line x1="1290" y1="247" x2="1290" y2="340" class="p"/><rect x="1195" y="340" width="190" height="50" class="box"/><text x="1225" y="372" class="s">F05 LOCKS - 20A</text>
<line x1="1290" y1="390" x2="1290" y2="470" class="p"/><rect x="1180" y="470" width="230" height="150" class="box"/><text x="1235" y="505" class="h">LOCK DRIVER</text><text x="1238" y="535" class="s">Cytron MDD10A</text><text x="1210" y="565" class="s">Dual H-bridge / 2 actuators</text><text x="1215" y="595" class="s">High-current branch</text>
</g>

<text x="65" y="710" class="h">BATTERY -</text><line x1="110" y1="730" x2="110" y2="800" class="g"/>
<line x1="110" y1="800" x2="1450" y2="800" class="g"/><text x="650" y="835" class="h">CHASSIS / BCM GROUND BUS</text>
<line x1="330" y1="600" x2="330" y2="800" class="g"/><line x1="570" y1="620" x2="570" y2="800" class="g"/><line x1="810" y1="620" x2="810" y2="800" class="g"/><line x1="1050" y1="620" x2="1050" y2="800" class="g"/><line x1="1290" y1="620" x2="1290" y2="800" class="g"/>
<text x="65" y="875" class="s">Fuse baseline: F00 80A, F01 5A, F02 3A, F03 5A, F04 40A, F05 20A.</text>
<text x="65" y="905" class="s">Final wire gauge must support the fuse protecting it. High-current motor return paths must not flow through Raspberry Pi signal grounds.</text>
</svg>