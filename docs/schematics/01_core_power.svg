<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.xs{font-size:13px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}</style><text x="40" y="50" class="t">FOXBODY BCM - CORE POWER / GROUND DISTRIBUTION</text><text x="40" y="82" class="s">Simple board names first. Fuse values are the v1 design baseline; final wire gauge must support the fuse protecting it.</text><text x="65" y="150" class="h">BATTERY +</text><line x1="110" y1="170" x2="110" y2="220" class="p"/><rect x="55" y="220" width="210" height="55" class="box"/><text x="88" y="255" class="h">F00 MAIN - 125A</text><line x1="265" y1="247" x2="1450" y2="247" class="p"/><text x="620" y="225" class="h">FUSED BCM / BODY POWER DISTRIBUTION BUS +12V</text><text x="1000" y="285" class="xs">Cooling fans and starter motor main feed remain separate battery-side circuits.</text><g><line x1="310" y1="247" x2="310" y2="340" class="p"/><rect x="215" y="340" width="190" height="50" class="box"/><text x="238" y="372" class="s">F01 CONTROLLER - 5A</text><line x1="310" y1="390" x2="310" y2="455" class="p"/><rect x="195" y="455" width="230" height="170" class="box"/><text x="240" y="490" class="h">BCM CONTROLLER</text><text x="247" y="520" class="s">Raspberry Pi 4B</text><text x="215" y="552" class="s">5V Power Supply</text><text x="215" y="582" class="s">12/24V -> 5V 10A / 50W</text><text x="215" y="610" class="xs">Fuse + transient protection on vehicle side</text></g><g><line x1="560" y1="247" x2="560" y2="340" class="p"/><rect x="465" y="340" width="190" height="50" class="box"/><text x="492" y="372" class="s">F02 INPUT BOARD - 3A</text><line x1="560" y1="390" x2="560" y2="470" class="p"/><rect x="445" y="470" width="230" height="150" class="box"/><text x="500" y="505" class="h">INPUT BOARD</text><text x="500" y="535" class="s">24DIB32 NPN</text><text x="475" y="565" class="s">32 digital inputs / RS485</text><text x="495" y="595" class="s">VIN +12V / GND</text></g><g><line x1="810" y1="247" x2="810" y2="340" class="p"/><rect x="715" y="340" width="190" height="50" class="box"/><text x="736" y="372" class="s">F03 OUTPUT CTRL - 5A</text><line x1="810" y1="390" x2="810" y2="470" class="p"/><rect x="695" y="470" width="235" height="150" class="box"/><text x="752" y="505" class="h">OUTPUT BOARD</text><text x="750" y="535" class="s">OPMSD16 PNP</text><text x="730" y="565" class="s">16 MOSFET outputs / control</text><text x="720" y="595" class="xs">Direct-load project ceiling: 4A/channel</text></g><g><line x1="1060" y1="247" x2="1060" y2="340" class="p"/><rect x="960" y="340" width="200" height="50" class="box"/><text x="982" y="372" class="s">F04 WINDOWS - 40A</text><line x1="1060" y1="390" x2="1060" y2="470" class="p"/><rect x="940" y="470" width="240" height="150" class="box"/><text x="990" y="505" class="h">WINDOW DRIVER</text><text x="972" y="535" class="s">Dual high-current H-bridge</text><text x="1000" y="565" class="s">9-30V supply</text><text x="978" y="595" class="s">Driver + passenger windows</text></g><g><line x1="1310" y1="247" x2="1310" y2="340" class="p"/><rect x="1210" y="340" width="200" height="50" class="box"/><text x="1240" y="372" class="s">F05 LOCKS - 20A</text><line x1="1310" y1="390" x2="1310" y2="470" class="p"/><rect x="1190" y="470" width="240" height="150" class="box"/><text x="1250" y="505" class="h">LOCK DRIVER</text><text x="1228" y="535" class="s">Dual H-bridge</text><text x="1210" y="565" class="s">5A cont / 9A peak per ch</text><text x="1220" y="595" class="s">Driver + passenger locks</text></g><text x="65" y="710" class="h">BATTERY -</text><line x1="110" y1="730" x2="110" y2="800" class="g"/><line x1="110" y1="800" x2="1450" y2="800" class="g"/><text x="640" y="835" class="h">CHASSIS / BCM GROUND BUS</text><line x1="310" y1="625" x2="310" y2="800" class="g"/><line x1="560" y1="620" x2="560" y2="800" class="g"/><line x1="810" y1="620" x2="810" y2="800" class="g"/><line x1="1060" y1="620" x2="1060" y2="800" class="g"/><line x1="1310" y1="620" x2="1310" y2="800" class="g"/><text x="65" y="875" class="s">High-current motor grounds return to a robust chassis/ground point. Pi signal ground is never used as motor-current return.</text><text x="65" y="905" class="s">F21/F22 fan feeds are separately fused at 50A each; starter motor main cable is not routed through F00.</text></svg>