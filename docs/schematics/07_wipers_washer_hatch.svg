<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}</style><text x="40" y="50" class="t">FOXBODY BCM - WIPERS / WASHER / HATCH / FUEL DOOR</text><text x="40" y="82" class="s">The multifunction switch becomes a command input. BCM controls the actual loads and honors wiper park.</text><text x="55" y="145" class="h">BATTERY +12V</text><line x1="95" y1="165" x2="95" y2="1000" class="p"/><rect x="145" y="145" width="215" height="55" class="box"/><text x="175" y="180" class="s">F14 WIPER MOTOR 25A</text><line x1="95" y1="172" x2="145" y2="172" class="p"/><rect x="425" y="115" width="280" height="160" class="box"/><text x="485" y="150" class="h">WIPER POWER STAGE</text><text x="455" y="185" class="s">Y12 LOW control</text><text x="455" y="215" class="s">Y13 HIGH control</text><text x="455" y="245" class="s">relay/driver sized for motor current</text><line x1="360" y1="172" x2="425" y2="172" class="p"/><line x1="705" y1="172" x2="870" y2="172" class="p"/><rect x="870" y="115" width="270" height="160" class="box"/><text x="940" y="150" class="h">WIPER MOTOR</text><text x="900" y="185" class="s">LOW terminal</text><text x="900" y="215" class="s">HIGH terminal</text><text x="900" y="245" class="s">PARK terminal -> X28</text><rect x="145" y="325" width="215" height="55" class="box"/><text x="175" y="360" class="s">F15 WASHER 10A</text><line x1="95" y1="352" x2="145" y2="352" class="p"/><rect x="425" y="315" width="280" height="80" class="box"/><text x="470" y="348" class="h">OUTPUT BOARD Y14</text><text x="465" y="378" class="s">direct if pump current <=4A, else relay</text><line x1="360" y1="352" x2="425" y2="352" class="p"/><line x1="705" y1="352" x2="870" y2="352" class="ctl"/><rect x="870" y="320" width="270" height="70" class="box"/><text x="940" y="362" class="s">WASHER PUMP</text><rect x="145" y="470" width="215" height="55" class="box"/><text x="175" y="505" class="s">F16 HATCH RELEASE 15A</text><line x1="95" y1="497" x2="145" y2="497" class="p"/><rect x="425" y="460" width="280" height="80" class="box"/><text x="470" y="493" class="h">OUTPUT BOARD Y08</text><text x="455" y="523" class="s">direct if solenoid current verified <=4A</text><line x1="360" y1="497" x2="425" y2="497" class="p"/><line x1="705" y1="497" x2="870" y2="497" class="ctl"/><rect x="870" y="465" width="270" height="70" class="box"/><text x="915" y="507" class="s">HATCH RELEASE SOLENOID</text><rect x="145" y="615" width="215" height="55" class="box"/><text x="175" y="650" class="s">F17 FUEL DOOR 10A</text><line x1="95" y1="642" x2="145" y2="642" class="p"/><rect x="425" y="605" width="280" height="80" class="box"/><text x="470" y="638" class="h">OUTPUT BOARD Y09</text><text x="455" y="668" class="s">direct if actuator current <=4A</text><line x1="360" y1="642" x2="425" y2="642" class="p"/><line x1="705" y1="642" x2="870" y2="642" class="ctl"/><rect x="870" y="610" width="270" height="70" class="box"/><text x="925" y="652" class="s">FUEL DOOR ACTUATOR</text><rect x="1200" y="115" width="520" height="650" class="box"/><text x="1340" y="150" class="h">INPUT BOARD COMMANDS</text><text x="1240" y="205" class="s">X17 MIST</text><text x="1240" y="240" class="s">X18 INTERMITTENT</text><text x="1240" y="275" class="s">X19 LOW</text><text x="1240" y="310" class="s">X20 HIGH</text><text x="1240" y="345" class="s">X21 WASHER</text><text x="1240" y="380" class="s">X28 WIPER PARK</text><text x="1240" y="445" class="s">X10 HATCH BUTTON</text><text x="1240" y="480" class="s">X29 FUEL DOOR BUTTON</text><text x="1240" y="545" class="h">WASHER LOGIC</text><text x="1240" y="580" class="s">Hold washer: pump + wiping while held.</text><text x="1240" y="615" class="s">Release: 2-3 extra passes, then ~6 sec delay,</text><text x="1240" y="650" class="s">then one courtesy wipe.</text><text x="1240" y="710" class="s">Wiper motor is a motor load; do not run it directly through Output Board.</text><rect x="150" y="800" width="650" height="210" class="box"/><text x="230" y="840" class="h">GROUND / PARK PATH</text><text x="190" y="885" class="s">Wiper motor ground -> chassis. Washer/hatch/fuel-door grounds -> chassis.</text><text x="190" y="925" class="s">Park switch retains electrical position feedback to X28 so BCM can stop blades at park.</text><text x="190" y="965" class="s">Exact Ford motor terminal names/colors will be copied from the 1988 EVTM/harness during final pinout.</text><line x1="150" y1="1050" x2="1650" y2="1050" class="g"/><text x="720" y="1085" class="s">CHASSIS GROUND BUS</text><text x="40" y="1150" class="s">F14-F17 are design fuse values; branch values will be confirmed against measured actuator/motor current before installation release.</text></svg>