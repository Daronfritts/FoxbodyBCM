<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}</style><text x="40" y="50" class="t">FOXBODY BCM - START / IGNITION / ACCESSORY</text><text x="40" y="82" class="s">Starter and main switched-power branches use relays/contactors. Starter defaults OFF; BCM security logic never intentionally kills a running engine.</text><text x="55" y="145" class="h">BATTERY +12V</text><line x1="95" y1="165" x2="95" y2="900" class="p"/><rect x="145" y="150" width="215" height="55" class="box"/><text x="175" y="185" class="s">F18 START CTRL 15A</text><line x1="95" y1="177" x2="145" y2="177" class="p"/><rect x="425" y="130" width="280" height="110" class="box"/><text x="485" y="163" class="h">START RELAY</text><text x="455" y="195" class="s">coil from Output Board Y15</text><text x="455" y="220" class="s">contact feeds starter-solenoid S</text><line x1="360" y1="177" x2="425" y2="177" class="p"/><line x1="705" y1="177" x2="900" y2="177" class="p"/><rect x="900" y="140" width="280" height="75" class="box"/><text x="945" y="185" class="s">STARTER SOLENOID - S TERMINAL</text><rect x="145" y="320" width="215" height="55" class="box"/><text x="175" y="355" class="s">F19 IGNITION 30A</text><line x1="95" y1="347" x2="145" y2="347" class="p"/><rect x="425" y="300" width="280" height="110" class="box"/><text x="480" y="333" class="h">IGNITION RELAY</text><text x="455" y="365" class="s">BCM-controlled coil</text><text x="455" y="390" class="s">contact feeds RUN/IGN bus</text><line x1="360" y1="347" x2="425" y2="347" class="p"/><line x1="705" y1="347" x2="900" y2="347" class="p"/><rect x="900" y="310" width="280" height="75" class="box"/><text x="980" y="355" class="s">RUN / IGN BUS</text><rect x="145" y="490" width="215" height="55" class="box"/><text x="175" y="525" class="s">F20 ACCESSORY 30A</text><line x1="95" y1="517" x2="145" y2="517" class="p"/><rect x="425" y="470" width="280" height="110" class="box"/><text x="475" y="503" class="h">ACCESSORY RELAY</text><text x="455" y="535" class="s">BCM-controlled coil</text><text x="455" y="560" class="s">contact feeds radio/ACC bus</text><line x1="360" y1="517" x2="425" y2="517" class="p"/><line x1="705" y1="517" x2="900" y2="517" class="p"/><rect x="900" y="480" width="280" height="75" class="box"/><text x="985" y="525" class="s">RADIO / ACC BUS</text><rect x="1240" y="120" width="480" height="590" class="box"/><text x="1360" y="155" class="h">START INTERLOCK INPUTS</text><text x="1280" y="210" class="s">X08 START BUTTON</text><text x="1280" y="245" class="s">X05 CLUTCH</text><text x="1280" y="280" class="s">X04 BRAKE</text><text x="1280" y="315" class="s">X27 RUN SENSE</text><text x="1280" y="350" class="s">MicroSquirt RPM must be 0 before crank</text><text x="1280" y="410" class="h">NORMAL BUTTON LOGIC</text><text x="1280" y="450" class="s">Clutch + start button -> crank.</text><text x="1280" y="485" class="s">Start button without clutch -> ACC state.</text><text x="1280" y="520" class="s">Clutch + start while engine running -> controlled shutdown.</text><text x="1280" y="580" class="h">RETAINED ACCESSORY POWER</text><text x="1280" y="620" class="s">Radio/ACC remains powered after shutdown.</text><text x="1280" y="650" class="s">Opening either door drops ACCESSORY relay.</text><rect x="150" y="690" width="1030" height="245" class="box"/><text x="225" y="730" class="h">EMERGENCY OVERRIDE SEQUENCE</text><text x="190" y="775" class="s">Hatch button in glovebox: two presses -> Defrost button: one press -> Brake + Start button.</text><text x="190" y="815" class="s">The first hatch/defrost press is held as a possible security-sequence event for 3 seconds.</text><text x="190" y="850" class="s">If the sequence is not continued, BCM performs the normal hatch-release or defrost action.</text><text x="190" y="895" class="s">This bypasses phone authorization only after the correct secret sequence; it does not bypass clutch/RPM starter safety.</text><line x1="150" y1="1010" x2="1650" y2="1010" class="g"/><text x="700" y="1045" class="s">CHASSIS / BCM GROUND BUS</text><text x="40" y="1135" class="s">F19/F20 are branch design values. Final switched-bus current must be measured after the replacement harness and accessory loads are known.</text></svg>