<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}</style><text x="40" y="50" class="t">FOXBODY BCM - LIGHTING / HORN / REAR DEFROST</text><text x="40" y="82" class="s">Heavy loads use Bosch-style relays only where needed. Small LED loads remain direct from Output Board when verified below 4A.</text><text x="55" y="145" class="h">BATTERY +12V</text><line x1="95" y1="165" x2="95" y2="1140" class="p"/><g><rect x="145" y="140" width="220" height="55" class="box"/><text x="175" y="175" class="s">F06 HEADLIGHTS 20A</text><line x1="95" y1="167" x2="145" y2="167" class="p"/><rect x="420" y="120" width="220" height="110" class="box"/><text x="465" y="150" class="h">HEADLIGHT RELAY</text><text x="445" y="180" class="s">30 feed / 87 lamps</text><text x="445" y="205" class="s">85/86 coil from Y10</text><line x1="365" y1="167" x2="420" y2="167" class="p"/><line x1="640" y1="167" x2="780" y2="167" class="p"/><rect x="780" y="125" width="240" height="85" class="box"/><text x="815" y="160" class="h">LOW BEAM LAMPS</text><text x="825" y="190" class="s">LH + RH</text></g><g><rect x="145" y="265" width="220" height="55" class="box"/><text x="175" y="300" class="s">F07 HIGH BEAMS 20A</text><line x1="95" y1="292" x2="145" y2="292" class="p"/><rect x="420" y="245" width="220" height="110" class="box"/><text x="465" y="275" class="h">HIGH-BEAM RELAY</text><text x="445" y="305" class="s">30 feed / 87 lamps</text><text x="445" y="330" class="s">85/86 coil from Y11</text><line x1="365" y1="292" x2="420" y2="292" class="p"/><line x1="640" y1="292" x2="780" y2="292" class="p"/><rect x="780" y="250" width="240" height="85" class="box"/><text x="815" y="285" class="h">HIGH BEAM LAMPS</text><text x="825" y="315" class="s">LH + RH</text></g><g><rect x="145" y="390" width="220" height="55" class="box"/><text x="175" y="425" class="s">F08 PARK/MARKER 15A</text><line x1="95" y1="417" x2="145" y2="417" class="p"/><rect x="420" y="375" width="220" height="85" class="box"/><text x="455" y="410" class="h">OUTPUT BOARD Y01</text><text x="455" y="440" class="s">direct only if measured <=4A</text><line x1="365" y1="417" x2="420" y2="417" class="p"/><line x1="640" y1="417" x2="780" y2="417" class="ctl"/><rect x="780" y="382" width="240" height="70" class="box"/><text x="815" y="425" class="s">PARK / MARKER LOADS</text></g><g><rect x="145" y="500" width="220" height="55" class="box"/><text x="175" y="535" class="s">F09 TURN/HAZARD 15A</text><line x1="95" y1="527" x2="145" y2="527" class="p"/><rect x="420" y="485" width="220" height="85" class="box"/><text x="455" y="520" class="h">OUTPUT BOARD</text><text x="455" y="550" class="s">Y04 left / Y05 right</text><line x1="365" y1="527" x2="420" y2="527" class="p"/><line x1="640" y1="515" x2="780" y2="515" class="ctl"/><line x1="640" y1="545" x2="780" y2="545" class="ctl"/><rect x="780" y="485" width="240" height="90" class="box"/><text x="820" y="520" class="s">LEFT LAMPS</text><text x="820" y="550" class="s">RIGHT LAMPS</text></g><g><rect x="145" y="620" width="220" height="55" class="box"/><text x="175" y="655" class="s">F10 HORN 20A</text><line x1="95" y1="647" x2="145" y2="647" class="p"/><rect x="420" y="600" width="220" height="110" class="box"/><text x="475" y="630" class="h">HORN RELAY</text><text x="450" y="660" class="s">coil controlled by Y06</text><text x="450" y="685" class="s">load contact feeds horn</text><line x1="365" y1="647" x2="420" y2="647" class="p"/><line x1="640" y1="647" x2="780" y2="647" class="p"/><rect x="780" y="615" width="240" height="70" class="box"/><text x="870" y="657" class="s">HORN</text></g><g><rect x="145" y="750" width="220" height="55" class="box"/><text x="175" y="785" class="s">F11 REAR DEFROST 30A</text><line x1="95" y1="777" x2="145" y2="777" class="p"/><rect x="420" y="730" width="220" height="110" class="box"/><text x="450" y="760" class="h">DEFROST RELAY</text><text x="450" y="790" class="s">coil controlled by Y07</text><text x="450" y="815" class="s">heavy contact feeds grid</text><line x1="365" y1="777" x2="420" y2="777" class="p"/><line x1="640" y1="777" x2="780" y2="777" class="p"/><rect x="780" y="745" width="240" height="70" class="box"/><text x="820" y="787" class="s">REAR WINDOW GRID</text></g><g><rect x="145" y="875" width="220" height="55" class="box"/><text x="175" y="910" class="s">F12 PUDDLE 5A</text><line x1="95" y1="902" x2="145" y2="902" class="p"/><rect x="420" y="865" width="220" height="75" class="box"/><text x="455" y="895" class="h">OUTPUT BOARD Y02</text><text x="455" y="925" class="s">direct LED load</text><line x1="365" y1="902" x2="420" y2="902" class="p"/><line x1="640" y1="902" x2="780" y2="902" class="ctl"/><rect x="780" y="870" width="240" height="65" class="box"/><text x="820" y="910" class="s">MIRROR PUDDLE LEDs</text></g><g><rect x="145" y="980" width="220" height="55" class="box"/><text x="175" y="1015" class="s">F13 COURTESY 10A</text><line x1="95" y1="1007" x2="145" y2="1007" class="p"/><rect x="420" y="970" width="220" height="75" class="box"/><text x="455" y="1000" class="h">OUTPUT BOARD Y03</text><text x="455" y="1030" class="s">direct if <=4A measured</text><line x1="365" y1="1007" x2="420" y2="1007" class="p"/><line x1="640" y1="1007" x2="780" y2="1007" class="ctl"/><rect x="780" y="975" width="240" height="65" class="box"/><text x="820" y="1015" class="s">INTERIOR / COURTESY</text></g><rect x="1130" y="145" width="560" height="700" class="box"/><text x="1280" y="185" class="h">INPUT / CONTROL SIDE</text><text x="1170" y="235" class="s">X22 Headlight switch -> BCM -> Y10 relay coil</text><text x="1170" y="275" class="s">X23 High beam -> BCM -> Y11 relay coil</text><text x="1170" y="315" class="s">X24/X25 Turn switch -> BCM -> Y04/Y05</text><text x="1170" y="355" class="s">X26 Hazard -> BCM flashes Y04 + Y05</text><text x="1170" y="395" class="s">X09 Defrost button -> BCM -> Y07 relay coil</text><text x="1170" y="435" class="s">Door/phone/security events -> Y02/Y03 courtesy outputs</text><text x="1170" y="500" class="h">GROUND</text><text x="1170" y="540" class="s">All lamps/horn/grid return to proper chassis grounds.</text><text x="1170" y="575" class="s">Relay coils get suppression; Output Board handles coil only.</text><text x="1170" y="640" class="h">FUSE NOTE</text><text x="1170" y="680" class="s">F06/F07/F11 are intentional high-current relay branches.</text><text x="1170" y="715" class="s">Final fuse may be reduced after actual lamp/grid current is measured.</text><text x="1170" y="780" class="s">Brake lights remain hardware-safe and are not dependent on BCM software.</text><line x1="1050" y1="1100" x2="1650" y2="1100" class="g"/><text x="1260" y="1135" class="s">CHASSIS GROUND BUS</text><text x="40" y="1200" class="s">Design baseline: headlights, horn, and rear defrost use relays; small lighting loads use Output Board directly if below 4A continuous.</text></svg>