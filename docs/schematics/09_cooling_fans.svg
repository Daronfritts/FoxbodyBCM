<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.ana{stroke:#6a1b9a;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}</style><text x="40" y="50" class="t">FOXBODY BCM - COOLING FANS</text><text x="40" y="82" class="s">Cooling fans are high-current loads. Fan motor current never passes through the Output Board.</text><text x="55" y="145" class="h">BATTERY +12V</text><line x1="95" y1="165" x2="95" y2="700" class="p"/><rect x="145" y="150" width="230" height="55" class="box"/><text x="175" y="185" class="s">F21 FAN 1 - 50A</text><line x1="95" y1="177" x2="145" y2="177" class="p"/><rect x="440" y="120" width="310" height="120" class="box"/><text x="505" y="155" class="h">FAN 1 POWER STAGE</text><text x="470" y="190" class="s">dedicated high-current relay/PWM driver</text><text x="470" y="218" class="s">BCM provides only enable/control</text><line x1="375" y1="177" x2="440" y2="177" class="p"/><line x1="750" y1="177" x2="925" y2="177" class="p"/><rect x="925" y="130" width="260" height="95" class="box"/><text x="1000" y="170" class="h">FAN 1</text><text x="965" y="205" class="s">high-current motor</text><rect x="145" y="320" width="230" height="55" class="box"/><text x="175" y="355" class="s">F22 FAN 2 - 50A</text><line x1="95" y1="347" x2="145" y2="347" class="p"/><rect x="440" y="290" width="310" height="120" class="box"/><text x="505" y="325" class="h">FAN 2 POWER STAGE</text><text x="470" y="360" class="s">dedicated high-current relay/PWM driver</text><text x="470" y="388" class="s">BCM provides only enable/control</text><line x1="375" y1="347" x2="440" y2="347" class="p"/><line x1="750" y1="347" x2="925" y2="347" class="p"/><rect x="925" y="300" width="260" height="95" class="box"/><text x="1000" y="340" class="h">FAN 2</text><text x="965" y="375" class="s">high-current motor</text><rect x="1235" y="115" width="500" height="420" class="box"/><text x="1365" y="150" class="h">CONTROL AUTHORITY</text><text x="1275" y="205" class="s">Normal control: BCM cooling state machine.</text><text x="1275" y="245" class="s">Primary temperature data: MicroSquirt coolant temp.</text><text x="1275" y="285" class="s">After-run: fans may remain active up to 3 min after shutdown.</text><text x="1275" y="325" class="s">Limp mode: overheat forces fan command.</text><text x="1275" y="365" class="s">MicroSquirt emergency/backup fan authority is retained</text><text x="1275" y="395" class="s">so a Pi/BCM failure does not remove all cooling control.</text><text x="1275" y="455" class="s">Final Focus-fan PWM/controller wiring will follow the exact</text><text x="1275" y="485" class="s">fan/controller hardware installed in the car.</text><rect x="145" y="500" width="1035" height="280" class="box"/><text x="235" y="540" class="h">CURRENT MONITORING</text><text x="185" y="590" class="s">Fan 1 power conductor -> Hall current sensor -> Fan 1 power stage/load.</text><text x="185" y="630" class="s">Fan 2 power conductor -> Hall current sensor -> Fan 2 power stage/load.</text><text x="185" y="675" class="s">Hall sensor analog outputs -> Analog Board -> BCM diagnostics.</text><text x="185" y="720" class="s">Fault example: fan commanded ON + near-zero current = failed/open fan circuit warning.</text><line x1="190" y1="750" x2="650" y2="750" class="ana"/><text x="675" y="755" class="s">ANALOG SIGNAL TO ANALOG BOARD</text><rect x="1235" y="600" width="500" height="260" class="box"/><text x="1335" y="640" class="h">GROUND / PROTECTION</text><text x="1275" y="690" class="s">Each fan has a heavy chassis return.</text><text x="1275" y="725" class="s">Do not return fan current through BCM electronics ground.</text><text x="1275" y="760" class="s">Use proper flyback/transient suppression for relay/contactors.</text><text x="1275" y="795" class="s">F21/F22 values are baseline and must match actual fan inrush.</text><line x1="150" y1="930" x2="1650" y2="930" class="g"/><text x="710" y="965" class="s">HEAVY CHASSIS GROUND</text><text x="40" y="1125" class="s">Current design intentionally keeps cooling fans outside the 80A BCM electronics main feed; each fan receives its own battery-side high-current fuse.</text></svg>