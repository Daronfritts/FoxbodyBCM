728" r="4" fill="white" stroke="#1565c0" stroke-width="2"/><text x="900" y="1718" font-size="16" font-weight="400" text-anchor="middle" fill="#1565c0">Unlock command</text><text x="460" y="1764" font-size="16" font-weight="400" text-anchor="end" fill="#111">Switch common (pin TBD)</text><text x="1340" y="1764" font-size="16" font-weight="400" text-anchor="start" fill="#111">GND / input return (verify)</text><polyline points="480,1772 1320,1772" fill="none" stroke="white" stroke-width="9"/><polyline points="480,1772 1320,1772" fill="none" stroke="#202020" stroke-width="3"/><circle cx="480" cy="1772" r="4" fill="white" stroke="#202020" stroke-width="2"/><circle cx="1320" cy="1772" r="4" fill="white" stroke="#202020" stroke-width="2"/><text x="900" y="1762" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">Low-current ground-switch return</text><text x="60" y="1839" font-size="16" font-weight="400" text-anchor="start" fill="#111">Factory +12V sources use a protected sinking interface. X labels are input channel numbers, not factory connector pin numbers.</text><text x="40" y="1890" font-size="20" font-weight="700" text-anchor="start" fill="#111">CIRCUIT NOTES</text><text x="60" y="1920" font-size="16" font-weight="400" text-anchor="start" fill="#111">Selected hardware is the dual H-bridge from the current inventory, not the superseded Cytron part names in older docs.</text><text x="60" y="1943" font-size="16" font-weight="400" text-anchor="start" fill="#111">Lock module: 3–14V supply, 2.2–6V logic, 5A continuous/9A peak per channel. Verify compatibility with charging-system voltage and transients before vehicle use. Use</text><text x="60" y="1966" font-size="16" font-weight="400" text-anchor="start" fill="#111">timed lock pulses.</text><polyline points="40,2044 75,2044" fill="none" stroke="white" stroke-width="9"/><polyline points="40,2044 75,2044" fill="none" stroke="#c62828" stroke-width="3"/><circle cx="40" cy="2044" r="4" fill="white" stroke="#c62828" stroke-width="2"/><circle cx="75" cy="2044" r="4" fill="white" stroke="#c62828" stroke-width="2"/><text x="85" y="2049" font-size="15" font-weight="400" text-anchor="start" fill="#111">power</text><polyline points="285,2044 320,2044" fill="none" stroke="white" stroke-width="9"/><polyline points="285,2044 320,2044" fill="none" stroke="#d66700" stroke-width="3"/><circle cx="285" cy="2044" r="4" fill="white" stroke="#d66700" stroke-width="2"/><circle cx="320" cy="2044" r="4" fill="white" stroke="#d66700" stroke-width="2"/><text x="330" y="2049" font-size="15" font-weight="400" text-anchor="start" fill="#111">switched</text><polyline points="530,2044 565,2044" fill="none" stroke="white" stroke-width="9"/><polyline points="530,2044 565,2044" fill="none" stroke="#202020" stroke-width="3"/><circle cx="530" cy="2044" r="4" fill="white" stroke="#202020" stroke-width="2"/><circle cx="565" cy="2044" r="4" fill="white" stroke="#202020" stroke-width="2"/><text x="575" y="2049" font-size="15" font-weight="400" text-anchor="start" fill="#111">ground</text><polyline points="775,2044 810,2044" fill="none" stroke="white" stroke-width="9"/><polyline points="775,2044 810,2044" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="775" cy="2044" r="4" fill="white" stroke="#1565c0" stroke-width="2"/><circle cx="810" cy="2044" r="4" fill="white" stroke="#1565c0" stroke-width="2"/><text x="820" y="2049" font-size="15" font-weight="400" text-anchor="start" fill="#111">signal</text><polyline points="1020,2044 1055,2044" fill="none" stroke="white" stroke-width="9"/><polyline points="1020,2044 1055,2044" fill="none" stroke="#26803c" stroke-width="3"/><circle cx="1020" cy="2044" r="4" fill="white" stroke="#26803c" stroke-width="2"/><circle cx="1055" cy="2044" r="4" fill="white" stroke="#26803c" stroke-width="2"/><text x="1065" y="2049" font-size="15" font-weight="400" text-anchor="start" fill="#111">motor</text><polyline points="1265,2044 1300,2044" fill="none" stroke="white" stroke-