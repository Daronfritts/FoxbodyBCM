<rect x="1040" y="590" width="430" height="230" class="box"/><text x="1140" y="625" class="h">BCM LOGIC OUTPUTS</text>
<text x="1080" y="680" class="s">DR_LOCK_DIR / DR_LOCK_PWM</text><text x="1080" y="735" class="s">PS_LOCK_DIR / PS_LOCK_PWM</text>
<line x1="1040" y1="675" x2="500" y2="675" class="ctl"/><line x1="500" y1="675" x2="500" y2="450" class="ctl"/>
<line x1="1040" y1="730" x2="650" y2="730" class="ctl"/><line x1="650" y1="730" x2="650" y2="450" class="ctl"/>
<text x="1040" y="790" class="s">Software interlock prevents conflicting commands.</text>
