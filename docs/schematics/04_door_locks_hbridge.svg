<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.mot{stroke:#2e7d32;stroke-width:5;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}
</style>
<text x="40" y="50" class="t">FOXBODY BCM - DOOR LOCKS - MDD10A H-BRIDGE</text>
<text x="40" y="82" class="s">Working architecture schematic - no reversing Bosch relay pairs</text>

<text x="55" y="150" class="h">BATTERY +12V</text><line x1="90" y1="170" x2="90" y2="220" class="p"/>
<rect x="55" y="220" width="130" height="50" class="box"/><text x="78" y="252" class="s">LOCK FUSE</text>
<line x1="185" y1="245" x2="360" y2="245" class="p"/>

<rect x="360" y="150" width="420" height="300" class="box"/><text x="470" y="185" class="h">CYTRON MDD10A</text>
<circle cx="360" cy="245" r="8" class="term"/><text x="380" y="250" class="s">VM / +12V POWER</text>
<circle cx="360" cy="390" r="8" class="term"/><text x="380" y="395" class="s">GND</text>
<circle cx="780" cy="230" r="8" class="term"/><text x="650" y="218" class="s">M1A</text>
<circle cx="780" cy="280" r="8" class="term"/><text x="650" y="268" class="s">M1B</text>
<circle cx="780" cy="340" r="8" class="term"/><text x="650" y="328" class="s">M2A</text>
<circle cx="780" cy="390" r="8" class="term"/><text x="650" y="378" class="s">M2B</text>
<circle cx="500" cy="450" r="8" class="term"/><text x="430" y="430" class="s">CH1 DIR/PWM</text>
<circle cx="650" cy="450" r="8" class="term"/><text x="585" y="430" class="s">CH2 DIR/PWM</text>

<line x1="780" y1="230" x2="1020" y2="230" class="mot"/><line x1="780" y1="280" x2="1020" y2="280" class="mot"/>
<rect x="1020" y="195" width="220" height="120" rx="14" class="box"/><text x="1060" y="235" class="h">DRIVER LOCK</text><text x="1085" y="270" class="s">2-wire actuator</text>
<line x1="780" y1="340" x2="1020" y2="340" class="mot"/><line x1="780" y1="390" x2="1020" y2="390" class="mot"/>
<rect x="1020" y="325" width="220" height="120" rx="14" class="box"/><text x="1040" y="365" class="h">PASSENGER LOCK</text><text x="1085" y="400" class="s">2-wire actuator</text>

<line x1="360" y1="390" x2="300" y2="390" class="g"/><line x1="300" y1="390" x2="300" y2="520" class="g"/><text x="220" y="550" class="h">CHASSIS GROUND</text><line x1="250" y1="520" x2="350" y2="520" class="g"/><line x1="270" y1="535" x2="330" y2="535" class="g"/><line x1="290" y1="550" x2="310" y2="550" class="g"/>

<rect x="70" y="620" width="390" height="180" class="box"/><text x="110" y="655" class="h">24DIB32 INPUT BOARD</text>
<circle cx="460" cy="700" r="8" class="term"/><text x="250" y="705" class="s">X11 LOCK REQUEST</text>
<circle cx="460" cy="755" r="8" class="term"/><text x="250" y="760" class="s">X12 UNLOCK REQUEST</text>

<rect x="600" y="620" width="300" height="180" class="box"/><text x="665" y="655" class="h">LOCK SWITCH</text>
<text x="630" y="705" class="s">LOCK contact</text><text x="630" y="760" class="s">UNLOCK contact</text><text x="770" y="790" class="s">COM -> ground</text>
