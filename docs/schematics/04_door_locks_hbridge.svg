<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.xs{font-size:13px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.mot{stroke:#2e7d32;stroke-width:5;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}</style>
<text x="40" y="50" class="t">FOXBODY BCM - DOOR LOCKS - LOCK DRIVER</text>
<text x="40" y="82" class="s">Selected hardware: dual H-bridge, 3-14V supply, 2.2-6V logic, 5A continuous / 9A peak per channel.</text>
<text x="55" y="145" class="h">BATTERY +12V</text><line x1="90" y1="165" x2="90" y2="215" class="p"/>
<rect x="45" y="215" width="210" height="55" class="box"/><text x="75" y="250" class="h">F05 LOCKS - 20A</text><line x1="255" y1="242" x2="360" y2="242" class="p"/>
<rect x="360" y="130" width="470" height="340" class="box"/><text x="500" y="168" class="h">LOCK DRIVER</text><text x="445" y="198" class="s">Dual 5A / 9A-peak H-bridge</text>
<circle cx="360" cy="242" r="8" class="term"/><text x="380" y="247" class="s">POWER +12V</text><circle cx="360" cy="420" r="8" class="term"/><text x="380" y="425" class="s">POWER GND</text>
<circle cx="830" cy="220" r="8" class="term"/><text x="685" y="210" class="s">CH1 MOTOR A</text><circle cx="830" cy="275" r="8" class="term"/><text x="685" y="265" class="s">CH1 MOTOR B</text>
<circle cx="830" cy="340" r="8" class="term"/><text x="685" y="330" class="s">CH2 MOTOR A</text><circle cx="830" cy="395" r="8" class="term"/><text x="685" y="385" class="s">CH2 MOTOR B</text>
<circle cx="490" cy="470" r="8" class="term"/><text x="410" y="450" class="s">CH1 IN-A / IN-B</text><circle cx="675" cy="470" r="8" class="term"/><text x="595" y="450" class="s">CH2 IN-A / IN-B</text>
<line x1="830" y1="220" x2="1050" y2="220" class="mot"/><line x1="830" y1="275" x2="1050" y2="275" class="mot"/><rect x="1050" y="185" width="250" height="125" rx="14" class="box"/><text x="1100" y="230" class="h">DRIVER LOCK</text><text x="1110" y="270" class="s">2-wire actuator</text>
<line x1="830" y1="340" x2="1050" y2="340" class="mot"/><line x1="830" y1="395" x2="1050" y2="395" class="mot"/><rect x="1050" y="320" width="250" height="125" rx="14" class="box"/><text x="1080" y="365" class="h">PASSENGER LOCK</text><text x="1110" y="405" class="s">2-wire actuator</text>
<line x1="360" y1="420" x2="300" y2="420" class="g"/><line x1="300" y1="420" x2="300" y2="525" class="g"/><line x1="250" y1="525" x2="350" y2="525" class="g"/><line x1="270" y1="540" x2="330" y2="540" class="g"/><line x1="290" y1="555" x2="310" y2="555" class="g"/><text x="210" y="585" class="h">CHASSIS GROUND</text>
<rect x="55" y="625" width="410" height="180" class="box"/><text x="130" y="660" class="h">INPUT BOARD</text><text x="120" y="687" class="s">24DIB32 NPN</text><circle cx="465" cy="720" r="8" class="term"/><text x="250" y="725" class="s">X11 LOCK REQUEST</text><circle cx="465" cy="770" r="8" class="term"/><text x="250" y="775" class="s">X12 UNLOCK REQUEST</text>
<rect x="575" y="625" width="285" height="180" class="box"/><text x="645" y="660" class="h">LOCK SWITCH</text><text x="610" y="720" class="s">LOCK contact</text><text x="610" y="770" class="s">UNLOCK contact</text><line x1="575" y1="715" x2="465" y2="720" class="sig"/><line x1="575" y1="765" x2="465" y2="770" class="sig"/><line x1="820" y1="790" x2="820" y2="835" class="g"/><text x="710" y="855" class="s">Switch common -> ground</text>
<rect x="965" y="590" width="540" height="250" class="box"/><text x="1110" y="625" class="h">BCM CONTROLLER / MOTOR CONTROL</text><text x="1010" y="680" class="s">DR_LOCK_A / DR_LOCK_B</text><text x="1010" y="730" class="s">PS_LOCK_A / PS_LOCK_B</text><line x1="965" y1="675" x2="490" y2="675" class="ctl"/><line x1="490" y1="675" x2="490" y2="470" class="ctl"/><line x1="965" y1="725" x2="675" y2="725" class="ctl"/><line x1="675" y1="725" x2="675" y2="470" class="ctl"/><text x="1010" y="785" class="xs">3.3V logic is within listing's 2.2-6V control-input range. Verify actual terminal order on arrival.</text>
