<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2114" viewBox="0 0 1800 2114" role="img"><title>04_door_locks_hbridge.svg</title><desc>Labelled rectangular devices, terminal names at every conductor end, and continuous wire paths. Design draft.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="30" font-weight="700" text-anchor="start" fill="#111">FOXBODY BCM / LOCK DRIVER / H-BRIDGE</text><text x="40" y="82" font-size="17" font-weight="400" text-anchor="start" fill="#111">Two motor wires per channel; neither motor conductor is permanently chassis-grounded.</text><text x="40" y="113" font-size="16" font-weight="400" text-anchor="start" fill="#111">DESIGN DRAFT • TBD = terminal/pin or wire specification not yet verified • Repeated device labels refer to the same device.</text><text x="40" y="145" font-size="16" font-weight="400" text-anchor="start" fill="#111">Wire colors indicate function. Actual harness colors and AWG remain TBD unless explicitly printed.</text><text x="40" y="190" font-size="21" font-weight="700" text-anchor="start" fill="#111">Driver supply</text><rect x="60" y="214" width="420" height="164" fill="white" stroke="#222" stroke-width="2.5"/><rect x="1320" y="214" width="420" height="164" fill="white" stroke="#222" stroke-width="2.5"/><text x="270" y="242" font-size="18" font-weight="700" text-anchor="middle" fill="#111">BCM fused distribution</text><text x="1530" y="242" font-size="18" font-weight="700" text-anchor="middle" fill="#111">Lock Driver</text><text x="460" y="289" font-size="16" font-weight="400" text-anchor="end" fill="#111">F05 OUT</text><text x="1340" y="289" font-size="16" font-weight="400" text-anchor="start" fill="#111">VIN (verify)</text><polyline points="480,297 1320,297" fill="none" stroke="white" stroke-width="9"/><polyline points="480,297 1320,297" fill="none" stroke="#c62828" stroke-width="3"/><circle cx="480" cy="297" r="4" fill="white" stroke="#c62828" stroke-width="2"/><circle cx="1320" cy="297" r="4" fill="white" stroke="#c62828" stroke-width="2"/><text x="900" y="287" font-size="16" font-weight="400" text-anchor="middle" fill="#c62828">F05 20A • +12V</text><text x="460" y="333" font-size="16" font-weight="400" text-anchor="end" fill="#111">CHASSIS GND</text><text x="1340" y="333" font-size="16" font-weight="400" text-anchor="start" fill="#111">GND (verify)</text><polyline points="480,341 1320,341" fill="none" stroke="white" stroke-width="9"/><polyline points="480,341 1320,341" fill="none" stroke="#202020" stroke-width="3"/><circle cx="480" cy="341" r="4" fill="white" stroke="#202020" stroke-width="2"/><circle cx="1320" cy="341" r="4" fill="white" stroke="#202020" stroke-width="2"/><text x="900" y="331" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">Ground return</text><text x="60" y="408" font-size="16" font-weight="400" text-anchor="start" fill="#111">F05 fuse sits upstream of this conductor; gauge/color TBD. Verify device terminal order.</text><text x="40" y="459" font-size="21" font-weight="700" text-anchor="start" fill="#111">DRIVER motor pair</text><rect x="60" y="483" width="420" height="164" fill="white" stroke="#222" stroke-width="2.5"/><rect x="1320" y="483" width="420" height="164" fill="white" stroke="#222" stroke-width="2.5"/><text x="270" y="511" font-size="18" font-weight="700" text-anchor="middle" fill="#111">LOCK DRIVER</text><text x="1530" y="511" font-size="18" font-weight="700" text-anchor="middle" fill="#111">DRIVER LOCK ACTUATOR</text><text x="460" y="558" font-size="16" font-weight="400" text-anchor="end" fill="#111">CH1 MOTOR A (TBD)</text><text x="1340" y="558" font-size="16" font-weight="400" text-anchor="start" fill="#111">Motor wire 1 (pin TBD)</text><polyline points="480,566 1320,566" fill="none" stroke="white" stroke-width="9"/><polyline points="480,566 1320,566" fill="none" stroke="#26803c" stroke-width="3"/><circle cx="480" cy="566" r="4" fill="white" stroke="#26803c" stroke-width="2"/>