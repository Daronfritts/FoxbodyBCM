roke="#222" stroke-width="2.5"/><text x="270" y="1339" font-size="18" font-weight="700" text-anchor="middle" fill="#111">BCM / MOTOR LOGIC (GPIO TBD)</text><text x="1530" y="1339" font-size="18" font-weight="700" text-anchor="middle" fill="#111">LOCK DRIVER</text><text x="460" y="1386" font-size="16" font-weight="400" text-anchor="end" fill="#111">PASSENGER IN-A (pin TBD)</text><text x="1340" y="1386" font-size="16" font-weight="400" text-anchor="start" fill="#111">CH2 IN-A (TBD)</text><polyline points="480,1394 1320,1394" fill="none" stroke="white" stroke-width="9"/><polyline points="480,1394 1320,1394" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="480" cy="1394" r="4" fill="white" stroke="#1565c0" stroke-width="2"/><circle cx="1320" cy="1394" r="4" fill="white" stroke="#1565c0" stroke-width="2"/><text x="900" y="1384" font-size="16" font-weight="400" text-anchor="middle" fill="#1565c0">3.3V-compatible control • verify</text><text x="460" y="1430" font-size="16" font-weight="400" text-anchor="end" fill="#111">PASSENGER IN-B (pin TBD)</text><text x="1340" y="1430" font-size="16" font-weight="400" text-anchor="start" fill="#111">CH2 IN-B (TBD)</text><polyline points="480,1438 1320,1438" fill="none" stroke="white" stroke-width="9"/><polyline points="480,1438 1320,1438" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="480" cy="1438" r="4" fill="white" stroke="#1565c0" stroke-width="2"/><circle cx="1320" cy="1438" r="4" fill="white" stroke="#1565c0" stroke-width="2"/><text x="900" y="1428" font-size="16" font-weight="400" text-anchor="middle" fill="#1565c0">3.3V-compatible control • verify</text><text x="460" y="1474" font-size="16" font-weight="400" text-anchor="end" fill="#111">LOGIC GND</text><text x="1340" y="1474" font-size="16" font-weight="400" text-anchor="start" fill="#111">SIGNAL GND (TBD)</text><polyline points="480,1482 1320,1482" fill="none" stroke="white" stroke-width="9"/><polyline points="480,1482 1320,1482" fill="none" stroke="#20