<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.bus{stroke:#666;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}</style><text x="40" y="50" class="t">FOXBODY BCM - INPUT BOARD TERMINAL MAP</text><text x="40" y="82" class="s">Input Board = Eletechsup 24DIB32 NPN. NPN inputs activate when X terminal is pulled low; COM banks receive fused +12V.</text><text x="55" y="145" class="h">F02 INPUT BOARD - 3A</text><line x1="120" y1="165" x2="120" y2="225" class="p"/><rect x="70" y="225" width="190" height="55" class="box"/><text x="95" y="260" class="s">FUSED BCM +12V</text><line x1="260" y1="252" x2="365" y2="252" class="p"/><rect x="365" y="120" width="800" height="930" class="box"/><text x="640" y="155" class="h">INPUT BOARD</text><text x="600" y="185" class="s">Eletechsup 24DIB32 NPN</text><circle cx="365" cy="252" r="8" class="term"/><text x="390" y="257" class="s">VIN +12V</text><circle cx="365" cy="305" r="8" class="term"/><text x="390" y="310" class="s">GND</text><line x1="365" y1="305" x2="285" y2="305" class="g"/><line x1="285" y1="305" x2="285" y2="1080" class="g"/><text x="190" y="1110" class="s">BCM GROUND BUS</text><circle cx="365" cy="360" r="8" class="term"/><text x="390" y="365" class="s">RS485 A+</text><circle cx="365" cy="405" r="8" class="term"/><text x="390" y="410" class="s">RS485 B-</text><line x1="365" y1="360" x2="250" y2="360" class="bus"/><line x1="365" y1="405" x2="250" y2="405" class="bus"/><text x="75" y="365" class="s">RS485 ADAPTER A</text><text x="75" y="410" class="s">RS485 ADAPTER B</text><text x="475" y="225" class="h">COM BANKS</text><text x="475" y="255" class="s">COM0 -> fused +12V</text><text x="475" y="285" class="s">COM1 -> fused +12V</text><text x="475" y="315" class="s">COM2 -> fused +12V</text><text x="475" y="345" class="s">COM3 -> fused +12V</text><line x1="565" y1="250" x2="565" y2="345" class="p"/><line x1="565" y1="250" x2="365" y2="250" class="p"/><text x="690" y="230" class="h">X00-X31 ASSIGNMENTS</text><g class="s"><text x="690" y="270">X00 Driver door ajar</text><text x="690" y="300">X01 Passenger door ajar</text><text x="690" y="330">X02 Hatch ajar</text><text x="690" y="360">X03 Hood switch</text><text x="690" y="390">X04 Brake state</text><text x="690" y="420">X05 Clutch switch</text><text x="690" y="450">X06 Parking brake</text><text x="690" y="480">X07 Reverse state</text><text x="690" y="510">X08 Start button</text><text x="690" y="540">X09 Defrost button</text><text x="690" y="570">X10 Hatch button</text><text x="690" y="600">X11 Lock request</text><text x="690" y="630">X12 Unlock request</text><text x="690" y="660">X13 Driver window UP</text><text x="690" y="690">X14 Driver window DOWN</text><text x="690" y="720">X15 Passenger window UP</text><text x="690" y="750">X16 Passenger window DOWN</text><text x="935" y="270">X17 Wiper MIST</text><text x="935" y="300">X18 Wiper INTERMITTENT</text><text x="935" y="330">X19 Wiper LOW</text><text x="935" y="360">X20 Wiper HIGH</text><text x="935" y="390">X21 Washer request</text><text x="935" y="420">X22 Headlight switch</text><text x="935" y="450">X23 High beam request</text><text x="935" y="480">X24 Left turn</text><text x="935" y="510">X25 Right turn</text><text x="935" y="540">X26 Hazard request</text><text x="935" y="570">X27 Ignition/RUN sense</text><text x="935" y="600">X28 Wiper park</text><text x="935" y="630">X29 Fuel door button</text><text x="935" y="660">X30 Spare</text><text x="935" y="690">X31 Spare</text></g><rect x="1210" y="170" width="410" height="370" class="box"/><text x="1290" y="205" class="h">GROUND-SWITCH EXAMPLE</text><circle cx="1210" cy="285" r="8" class="term"/><text x="1230" y="290" class="s">X08</text><line x1="1210" y1="285" x2="1370" y2="285" class="sig"/><rect x="1370" y="255" width="150" height="60" class="box"/><text x="1400" y="290" class="s">START BUTTON</text><line x1="1520" y1="285" x2="1570" y2="285" class="g"/><line x1="1570" y1="285" x2="1570" y2="350" class="g"/><text x="1500" y="380" class="s">CHASSIS GND</text><rect x="1210" y="585" width="410" height="330" class="box"/><text x="1280" y="620" class="h">FACTORY +12V SIGNAL</text><text x="1240" y="660" class="s">Brake / reverse / RUN lines that remain +12V circuits</text><text x="1240" y="690" class="s">do NOT connect raw +12V directly as a low-side command.</text><rect x="1320" y="735" width="180" height="65" class="box"/><text x="1350" y="775" class="s">12V -> NPN INTERFACE</text><line x1="1215" y1="767" x2="1320" y2="767" class="p"/><line x1="1500" y1="767" x2="1605" y2="767" class="sig"/><text x="1230" y="750" class="s">Factory +12V</text><text x="1515" y="750" class="s">to assigned X input</text><text x="40" y="1160" class="s">Safety: retain hardware-safe brake-light operation independently of BCM logic. Exact switch connector IDs/wire colors will be added during harness pinout phase.</text></svg>