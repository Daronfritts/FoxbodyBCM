<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.xs{font-size:13px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.mot{stroke:#2e7d32;stroke-width:5;fill:none}.ana{stroke:#6a1b9a;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}</style>
<text x="40" y="50" class="t">FOXBODY BCM - POWER WINDOWS - WINDOW DRIVER</text>
<text x="40" y="82" class="s">Selected hardware: dual high-current H-bridge, 9-30V supply, 3.3V/5V control, A/B direction plus PA/PB PWM.</text>
<text x="55" y="150" class="h">BATTERY +12V</text><line x1="90" y1="170" x2="90" y2="220" class="p"/><rect x="45" y="220" width="225" height="55" class="box"/><text x="72" y="255" class="h">F04 WINDOWS - 40A</text><line x1="270" y1="247" x2="360" y2="247" class="p"/>
<rect x="360" y="125" width="500" height="360" class="box"/><text x="515" y="165" class="h">WINDOW DRIVER</text><text x="460" y="195" class="s">Dual 9-30V high-current H-bridge</text><circle cx="360" cy="247" r="8" class="term"/><text x="380" y="252" class="s">POWER +12V</text><circle cx="360" cy="430" r="8" class="term"/><text x="380" y="435" class="s">POWER GND</text>
<circle cx="860" cy="215" r="8" class="term"/><text x="720" y="205" class="s">CH-A MOTOR +</text><circle cx="860" cy="275" r="8" class="term"/><text x="720" y="265" class="s">CH-A MOTOR -</text><circle cx="860" cy="345" r="8" class="term"/><text x="720" y="335" class="s">CH-B MOTOR +</text><circle cx="860" cy="405" r="8" class="term"/><text x="720" y="395" class="s">CH-B MOTOR -</text>
<circle cx="480" cy="485" r="8" class="term"/><text x="405" y="465" class="s">A / B / PA</text><circle cx="690" cy="485" r="8" class="term"/><text x="615" y="465" class="s">A2 / B2 / PB</text>
<line x1="860" y1="215" x2="1050" y2="215" class="mot"/><line x1="860" y1="275" x2="1050" y2="275" class="mot"/><rect x="1050" y="175" width="250" height="135" rx="14" class="box"/><text x="1090" y="220" class="h">DRIVER WINDOW</text><text x="1110" y="260" class="s">2-wire motor</text>
<line x1="860" y1="345" x2="1050" y2="345" class="mot"/><line x1="860" y1="405" x2="1050" y2="405" class="mot"/><rect x="1050" y="325" width="250" height="135" rx="14" class="box"/><text x="1070" y="370" class="h">PASSENGER WINDOW</text><text x="1110" y="410" class="s">2-wire motor</text>
<line x1="360" y1="430" x2="300" y2="430" class="g"/><line x1="300" y1="430" x2="300" y2="545" class="g"/><line x1="250" y1="545" x2="350" y2="545" class="g"/><line x1="270" y1="560" x2="330" y2="560" class="g"/><line x1="290" y1="575" x2="310" y2="575" class="g"/><text x="205" y="605" class="h">CHASSIS GROUND</text>
<rect x="50" y="650" width="430" height="225" class="box"/><text x="130" y="687" class="h">INPUT BOARD</text><text x="135" y="714" class="s">24DIB32 NPN</text><circle cx="480" cy="745" r="8" class="term"/><text x="245" y="750" class="s">X13 DRIVER UP</text><circle cx="480" cy="790" r="8" class="term"/><text x="245" y="795" class="s">X14 DRIVER DOWN</text><circle cx="480" cy="835" r="8" class="term"/><text x="245" y="840" class="s">X15 PASSENGER UP</text><circle cx="480" cy="870" r="8" class="term"/><text x="245" y="875" class="s">X16 PASSENGER DOWN</text>
<rect x="585" y="650" width="280" height="225" class="box"/><text x="645" y="687" class="h">WINDOW SWITCHES</text><text x="615" y="750" class="s">DR UP</text><text x="615" y="795" class="s">DR DOWN</text><text x="615" y="840" class="s">PS UP</text><text x="615" y="875" class="s">PS DOWN</text><line x1="585" y1="745" x2="480" y2="745" class="sig"/><line x1="585" y1="790" x2="480" y2="790" class="sig"/><line x1="585" y1="835" x2="480" y2="835" class="sig"/><line x1="585" y1="870" x2="480" y2="870" class="sig"/>
<rect x="965" y="595" width="560" height="285" class="box"/><text x="1105" y="635" class="h">BCM CONTROLLER / MOTOR CONTROL</text><text x="1010" y="690" class="s">DR_WIN_DIR_A / DR_WIN_DIR_B / DR_WIN_PWM</text><text x="1010" y="745" class="s">PS_WIN_DIR_A / PS_WIN_DIR_B / PS_WIN_PWM</text><line x1="965" y1="685" x2="480" y2="685" class="ctl"/><line x1="480" y1="685" x2="480" y2="485" class="ctl"/><line x1="965" y1="740" x2="690" y2="740" class="ctl"/><line x1="690" y1="740" x2="690" y2="485" class="ctl"/><text x="1010" y="800" class="s">Software: reversal dead-time, run timeout, obstruction/end-stop shutdown.</text><text x="1010" y="835" class="xs">Final pin names/order will be copied from PCB silk-screen when board arrives and is bench verified.</text>
<rect x="1320" y="175" width="240" height="285" class="box"/><text x="1350" y="215" class="h">CURRENT SENSING</text><text x="1345" y="265" class="s">External Hall sensors</text><text x="1345" y="310" class="s">Driver window current</text><text x="1345" y="350" class="s">Passenger window current</text><text x="1345" y="395" class="s">Outputs -> Analog Board</text><text x="1345" y="430" class="s">Analog Board -> BCM</text>
</svg>