<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<style>
text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.xs{font-size:13px}.p{stroke:#c62828;stroke-width:5;fill:none}.g{stroke:#111;stroke-width:4;fill:none}.sig{stroke:#1565c0;stroke-width:4;fill:none}.ctl{stroke:#ef6c00;stroke-width:4;fill:none}.mot{stroke:#2e7d32;stroke-width:5;fill:none}.ana{stroke:#6a1b9a;stroke-width:4;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.term{fill:#fff;stroke:#111;stroke-width:2}
</style>
<text x="40" y="50" class="t">FOXBODY BCM - POWER WINDOWS - SOLID-STATE REVERSING DRIVER</text>
<text x="40" y="82" class="s">Simple name: WINDOW DRIVER. Hardware: Cytron MDD20A dual H-bridge. Switches are inputs only.</text>

<text x="55" y="150" class="h">BATTERY +12V</text><line x1="90" y1="170" x2="90" y2="220" class="p"/>
<rect x="45" y="220" width="190" height="50" class="box"/><text x="65" y="252" class="h">F04 WINDOWS - 40A</text>
<line x1="235" y1="245" x2="360" y2="245" class="p"/>

<rect x="360" y="130" width="450" height="330" class="box"/><text x="500" y="168" class="h">WINDOW DRIVER</text><text x="525" y="195" class="xs">Cytron MDD20A</text>
<circle cx="360" cy="245" r="8" class="term"/><text x="380" y="250" class="s">VM / +12V POWER</text>
<circle cx="360" cy="405" r="8" class="term"/><text x="380" y="410" class="s">GND</text>
<circle cx="810" cy="220" r="8" class="term"/><text x="675" y="210" class="s">M1A</text>
<circle cx="810" cy="275" r="8" class="term"/><text x="675" y="265" class="s">M1B</text>
<circle cx="810" cy="340" r="8" class="term"/><text x="675" y="330" class="s">M2A</text>
<circle cx="810" cy="395" r="8" class="term"/><text x="675" y="385" class="s">M2B</text>
<circle cx="510" cy="460" r="8" class="term"/><text x="440" y="442" class="s">CH1 DIR/PWM</text>
<circle cx="670" cy="460" r="8" class="term"/><text x="600" y="442" class="s">CH2 DIR/PWM</text>

<line x1="810" y1="220" x2="1030" y2="220" class="mot"/><line x1="810" y1="275" x2="1030" y2="275" class="mot"/>
<rect x="1030" y="180" width="235" height="135" rx="14" class="box"/><text x="1065" y="225" class="h">DRIVER WINDOW</text><text x="1080" y="265" class="s">2-wire motor</text>
<line x1="810" y1="340" x2="1030" y2="340" class="mot"/><line x1="810" y1="395" x2="1030" y2="395" class="mot"/>
<rect x="1030" y="325" width="235" height="135" rx="14" class="box"/><text x="1045" y="370" class="h">PASSENGER WINDOW</text><text x="1080" y="410" class="s">2-wire motor</text>

<line x1="360" y1="405" x2="300" y2="405" class="g"/><line x1="300" y1="405" x2="300" y2="530" class="g"/><text x="210" y="565" class="h">CHASSIS GROUND</text><line x1="250" y1="530" x2="350" y2="530" class="g"/><line x1="270" y1="545" x2="330" y2="545" class="g"/><line x1="290" y1="560" x2="310" y2="560" class="g"/>

<rect x="55" y="635" width="420" height="220" class="box"/><text x="145" y="675" class="h">INPUT BOARD</text><text x="170" y="700" class="xs">24DIB32 NPN</text>
<circle cx="475" cy="730" r="8" class="term"/><text x="245" y="735" class="s">X13 DRIVER UP</text>
<circle cx="475" cy="775" r="8" class="term"/><text x="245" y="780" class="s">X14 DRIVER DOWN</text>
<circle cx="475" cy="820" r="8" class="term"/><text x="245" y="825" class="s">X15 PASSENGER UP</text>
<circle cx="475" cy="860" r="8" class="term"/><text x="245" y="865" class="s">X16 PASSENGER DOWN</text>

<rect x="580" y="635" width="280" height="220" class="box"/><text x="645" y="675" class="h">WINDOW SWITCHES</text>
<text x="610" y="735" class="s">DR UP</text><text x="610" y="780" class="s">DR DOWN</text><text x="610" y="825" class="s">PS UP</text><text x="610" y="865" class="s">PS DOWN</text>
<line x1="580" y1="730" x2="475" y2="730" class="sig"/><line x1="580" y1="775" x2="475" y2="775" class="sig"/><line x1="580" y1="820" x2="475" y2="820" class="sig"/><line x1="580" y1="860" x2="475" y2="860" class="sig"/>
<line x1="820" y1="835" x2="820" y2="900" class="g"/><text x="745" y="925" class="s">Switch common -&gt; ground</text>

<rect x="980" y="600" width="500" height="270" class="box"/><text x="1095" y="640" class="h">BCM CONTROLLER / MOTOR CONTROL</text><text x="1165" y="665" class="xs">Raspberry Pi / I/O control</text>
<text x="1020" y="710" class="s">DR_WIN_DIR / DR_WIN_PWM</text><text x="1020" y="765" class="s">PS_WIN_DIR / PS_WIN_PWM</text>
<line x1="980" y1="705" x2="510" y2="705" class="ctl"/><line x1="510" y1="705" x2="510" y2="460" class="ctl"/>
<line x1="980" y1="760" x2="670" y2="760" class="ctl"/><line x1="670" y1="760" x2="670" y2="460" class="ctl"/>
<text x="1020" y="820" class="s">Dead-time + current limit + timeout enforced in software.</text>

<rect x="1270" y="175" width="260" height="285" class="box"/><text x="1310" y="215" class="h">CURRENT SENSING</text>
<text x="1300" y="265" class="s">Driver hall sensor</text><text x="1300" y="310" class="s">Passenger hall sensor</text><text x="1300" y="355" class="s">Sensor outputs -&gt; ADC</text><text x="1300" y="400" class="s">ADC -&gt; BCM</text>
<line x1="1265" y1="247" x2="1270" y2="247" class="ana"/><line x1="1265" y1="392" x2="1270" y2="392" class="ana"/>
</svg>